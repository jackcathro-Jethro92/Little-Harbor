# Runs the smoke test in Chromium and WebKit on every pull request and push to main.
# On main, once the tests pass, the game is published to GitHub Pages.
name: Test and deploy

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        browser: [chromium, webkit]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install playwright
      - run: python -m playwright install --with-deps ${{ matrix.browser }}
      - run: python tests/smoke_test.py ${{ matrix.browser }}

  deploy:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: smoke
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    concurrency:
      group: pages
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Collect the game files
        run: mkdir _site && cp -r index.html css js _site/
      - name: Stamp this version on the game, so phones and browsers load the new files instead of old saved copies
        run: |
          V=${GITHUB_SHA::7}
          sed -i -E "s#(src=\"js/[^\"]+\.js)\"#\1?v=$V\"#; s#(href=\"css/[^\"]+\.css)\"#\1?v=$V\"#; s#const BUILD='dev'#const BUILD='$V'#" _site/index.html
          grep -c "?v=$V" _site/index.html
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
