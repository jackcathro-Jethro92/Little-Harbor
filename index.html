<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Little Harbor</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Pixelify+Sans:wght@500;700&display=swap">
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<div class="row">
  <div class="stat">Day <b id="day">1</b></div>
  <div class="stat"><b id="gold">0</b> gold</div>
  <div class="stat"><b id="inv">0</b> fish</div>
</div>
<div class="vit">
  <div class="box"><div class="r2"><span class="tag">HP</span><div class="track"><div class="fill" id="hpf"></div></div></div><div class="num" id="hpn"></div></div>
  <div class="box"><div class="r2"><span class="tag">STA</span><div class="track"><div class="fill" id="staf"></div></div></div><div class="num" id="stan"></div></div>
</div>
<div id="status" style="display:none"></div>
<div id="wrap"><button id="menubtn" aria-label="Menu">☰</button><canvas id="c" width="176" height="208"></canvas><div id="flash"></div><div id="dlg"><canvas id="dlg-pt" width="48" height="42"></canvas><div id="dlg-main"><span id="dlg-who"></span><div id="dlg-txt"></div><div id="dlg-ch"></div></div><span id="dlg-arrow">▼</span></div><div id="toast"></div></div>
<div id="msg"></div>
<div class="row"><button id="deck">Deck</button><button id="sleep">Sleep</button><button id="bagbtn">Bag</button><button id="chbtn">Me</button><button id="skbtn">Skills</button><button id="mapbtn">Map</button></div>
<div class="pad">
  <div class="dpad">
    <button id="up" aria-label="Move up">▲</button>
    <button id="left" aria-label="Move left">◀</button>
    <button id="down" aria-label="Move down">▼</button>
    <button id="right" aria-label="Move right">▶</button>
  </div>
  <button id="act">Use</button>
</div>
<div id="craft"><div id="cr-title"></div><div id="cr-list"></div><div id="cr-det"></div><div id="cr-bt"><button id="cr-go">Craft</button><button id="cr-back">Back</button></div></div>
<div id="menu"><div id="menu-card"><div id="menu-t"></div><div id="menu-o"></div></div></div>
<div id="mapov"><div id="map-t">MAP</div><canvas id="mc"></canvas><div id="map-h">Only places you have sailed or walked near are shown.</div><button id="map-back">Back</button></div>
<div id="ch"><div id="ch-title">YOU</div><div id="ch-body"><canvas id="ch-pt" width="96" height="96"></canvas><div id="ch-info"></div><div id="ch-more"></div></div><button id="ch-save">Save game</button><button id="ch-back">Back</button></div>
<div id="skills"><div id="sk-title">SKILLS</div><div id="sk-list"></div><button id="sk-back">Back</button></div>
<div id="bag"><div id="bhead"><button id="bprev" aria-label="Previous pocket">◀</button><div id="btitle"></div><button id="bnext" aria-label="Next pocket">▶</button></div>
<div id="bmain"><div id="bleft"><canvas id="bic" width="48" height="56"></canvas><div id="bcap"></div></div><div id="blist"></div></div>
<div id="bdesc"><canvas id="bdi" width="16" height="16"></canvas><div id="btxt"></div></div><div id="bpop"></div><button id="bback">Back</button></div>
<div id="store"><h1 id="st"></h1><div id="items"></div><button id="sclose" style="padding:10px 22px;margin-top:12px">Close</button></div>
<div id="title"><h1 id="title-h"></h1><div id="title-body"></div><div id="title-note"></div></div>
<div id="look">
  <h1 id="lookt">Who's the fisher?</h1>
  <canvas id="pv" width="16" height="20"></canvas>
  <div id="sws"></div>
  <button id="go" style="padding:10px 22px;font-size:18px">Set sail</button>
  <button id="lookx" style="padding:8px 18px;display:none">Cancel</button>
</div>
